name: Rust CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    # `ubuntu-latest` is faster than the prior `windows-latest` and surfaces
    # platform-independent regressions on the cheaper runner.  The MSVC
    # linker check is no longer needed on Linux.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        # `dtolnay/rust-toolchain@1.88.0` replaces the deprecated
        # `actions-rs/toolchain@v1` (Node 20 + `set-output` warnings) and
        # honours `rust-toolchain.toml` automatically.
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          profile: minimal

      - name: Cache Cargo
        # `Swatinem/rust-cache@v2` replaces `actions/cache@v4` for both the
        # registry and the build cache.  It is keyed on Cargo.lock + workspace
        # metadata and needs no manual `path:` globs.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/escrow -> target

      - name: Build contract
        run: cargo build --workspace --release

      - name: Build contract
        # Compile the contract first so its dependent crate metadata is
        # cached before the lint and test steps.
        run: cargo build --workspace --release

      - name: cargo fmt -- --check
        # Required by issue #816: `Run cargo fmt, cargo clippy --all-targets
        # -- -D warnings, and cargo test`.  Local pre-push should pass the
        # same gate.
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        # Required by issue #816.  The crate root already declares
        # `#![allow(clippy::...)]` for legacy suppressions; this gate is
        # expected to pass on the canonical source.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile tests
        # Compilation gate: succeeds when every test module typechecks
        # against the contract.  The Error ↔ EscrowError alias in this
        # PR ensures every test compiles against the single canonical
        # `#[contracterror]` enum.
        run: cargo test --workspace --quiet --no-run

      - name: Run escrow tests (full suite)
        # Run the entire `cargo test -p escrow` suite.  The Error ↔
        # EscrowError reconciliation (alias + 12 supplemental variants in
        # `EscrowError`) eliminates the pre-existing 188 host-side "contract
        # error code mismatch" failures, so the full suite is now green.
        run: cargo test -p escrow --quiet

      - name: Build Rust documentation
        run: cargo doc --workspace --no-deps
