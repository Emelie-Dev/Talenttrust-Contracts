name: Rust CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    # Cross-platform matrix: run on Ubuntu (faster/default), Windows (MSVC),
    # and macOS (Unix) to surface platform-specific regressions before merge.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install 1.88.0
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0

      - name: Build contract (WASM)
        run: cargo build -p escrow --release --target wasm32-unknown-unknown

      - name: Compile tests (host)
        run: cargo test --workspace --quiet --no-run

      - name: Build Rust documentation
        run: cargo doc --workspace --no-deps
