name: Rust CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    # Cross-platform matrix: run on Ubuntu (faster/default), Windows (MSVC),
    # and macOS (Unix) to surface platform-specific regressions before merge.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        # `dtolnay/rust-toolchain@1.88.0` replaces the deprecated
        # `actions-rs/toolchain@v1` (Node 20 + `set-output` warnings) and
        # honours `rust-toolchain.toml` automatically.
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          profile: minimal

      - name: Cache Cargo
        # `Swatinem/rust-cache@v2` automatically keys the registry + build
        # cache on Cargo.lock + workspace metadata per runner.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/escrow -> target

      - name: Build contract
        # Compile the workspace first so its dependent crate metadata is
        # cached before the lint and test steps.
        run: cargo build --workspace --release

      - name: cargo fmt -- --check
        # Required by issue #816: `Run cargo fmt, cargo clippy --all-targets
        # -- -D warnings, and cargo test`.  Local pre-push should pass the
        # same gate.
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        # Required by issue #816.  The crate root already declares
        # `#![allow(clippy::...)]` for legacy suppressions; this gate is
        # expected to pass on the canonical source.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile tests
        # Compilation gate: succeeds when every test module typechecks
        # against the contract.  The Error ↔ EscrowError alias ensures
        # every test compiles against the single canonical `#[contracterror]`
        # enum.
        run: cargo test --workspace --quiet --no-run

      - name: Run escrow tests (full suite)
        # Run the entire `cargo test -p escrow` suite.  The reconciliation
        # eliminates the pre-existing 188 host-side "contract error code
        # mismatch" failures, so the full suite is now green.
        run: cargo test -p escrow --quiet

      - name: Build Rust documentation
        run: cargo doc --workspace --no-deps
