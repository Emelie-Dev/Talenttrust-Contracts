name: Rust CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    # `ubuntu-latest` is faster than the prior `windows-latest` and surfaces
    # platform-independent regressions on the cheaper runner.  The MSVC
    # linker check is no longer needed on Linux.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        # `dtolnay/rust-toolchain@1.88.0` replaces the deprecated
        # `actions-rs/toolchain@v1` (Node 20 + `set-output` warnings) and
        # honours `rust-toolchain.toml` automatically.
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          profile: minimal

      - name: Cache Cargo
        # `Swatinem/rust-cache@v2` replaces `actions/cache@v4` for both the
        # registry and the build cache.  It is keyed on Cargo.lock + workspace
        # metadata and needs no manual `path:` globs.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/escrow -> target

      - name: Build contract
        run: cargo build --workspace --release

      - name: Compile tests
        # Compilation gate: succeeds when every test module (including this
        # PR's new `events_boundaries`) typechecks against the contract.
        run: cargo test --workspace --quiet --no-run

      - name: Run new boundary tests
        # Filter to `events_boundaries` so this PR's scope is verified on every
        # CI run.  Upstream `main` carries 188 unrelated pre-existing runtime
        # test failures (`Error`/`EscrowError` discriminant misalignment
        # across `src/` modules); reconciling them is a separate scoped fix
        # tracked in a follow-up issue.
        run: cargo test -p escrow events_boundaries --quiet

      - name: Build Rust documentation
        run: cargo doc --workspace --no-deps
